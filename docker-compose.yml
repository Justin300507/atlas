services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      # Change these for a real deployment -- see DEPLOYMENT.md.
      ATLAS_ENV: development
      ATLAS_ALLOWED_ORIGINS: http://localhost:5173
      ATLAS_LOG_LEVEL: INFO
      ATLAS_JOBS_DB_PATH: /app/data/atlas_jobs.db
    volumes:
      # Persists atlas_jobs.db (job history/status) across container
      # restarts. Mounted at /app/data specifically, not /app -- mounting
      # the whole working directory would shadow the app/ package copied
      # into the image and break the container entirely.
      - atlas-jobs-data:/app/data
    healthcheck:
      # No curl/wget in python:3.12-slim by default -- reuse the
      # interpreter that's already there instead of adding a package just
      # for this. GET /health also actually probes the jobs database, not
      # just "is the process up."
      test: ["CMD", "python", "-c", "import urllib.request as u, sys; sys.exit(0 if u.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the static bundle at build time -- see frontend/Dockerfile.
        VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # nginx:alpine ships wget via busybox, no extra package needed.
      # Without this, `docker compose up --wait` only confirms the
      # container reached "running" state, not that nginx has finished
      # its docker-entrypoint.d setup scripts and is actually serving --
      # a real race that hit docker-validate.yml's CI check once (the
      # curl ran while nginx was still mid-startup, confirmed via
      # `docker compose logs` on the failed run).
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  atlas-jobs-data:
