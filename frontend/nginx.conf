server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: serve index.html for any path that isn't a real
    # static file, so a refresh on a non-root path (if routing is ever
    # added) doesn't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
