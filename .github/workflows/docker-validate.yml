name: Docker validate

# Proves the docker-compose stack actually builds and boots, since no
# machine in local dev has Docker installed to run this by hand -- see
# DEPLOYMENT.md. Not a substitute for the pytest/vitest suites; this only
# checks the container wiring (build, healthcheck, port mapping, env
# plumbing), which unit tests can't see.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-validate.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/docker-validate.yml"
  workflow_dispatch:

jobs:
  compose-up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the stack
        run: docker compose up --build -d --wait --wait-timeout 120

      - name: Backend health check
        run: |
          status=$(curl -sf http://localhost:8000/health | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
          echo "backend /health status: $status"
          test "$status" = "ok"

      - name: Frontend serves the app shell
        # Retries because `--wait` above only guarantees the containers
        # that HAVE a healthcheck are ready -- frontend didn't have one
        # (fixed in docker-compose.yml), so this is belt-and-suspenders
        # against the same class of startup race, not a substitute for
        # that fix.
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:5173/ | grep -qi '<div id="root"'; then
              echo "frontend app shell OK"
              exit 0
            fi
            echo "attempt $i: frontend not ready yet, retrying..."
            sleep 2
          done
          echo "frontend did not return the expected app shell after retries"
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
