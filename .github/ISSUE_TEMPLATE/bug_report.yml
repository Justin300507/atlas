name: Bug report
description: Something is broken, crashes, or produces output that doesn't match reality.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If this is a **false positive/negative in a
        report Atlas generated** (a security finding, quality score, or
        graph edge that doesn't hold up against the real repo), use the
        "False positive" template instead — it asks for the specific
        details that make those reports actionable.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you do, what did you expect, what actually happened?
    validations:
      required: true
  - type: input
    id: repo-url
    attributes:
      label: Repo URL analyzed (if applicable)
      description: The GitHub URL you pasted into Atlas, if this is about an analysis run.
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands/requests, or steps in the UI.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version (`python --version`), Node version, Docker or local, branch/commit.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      render: shell
